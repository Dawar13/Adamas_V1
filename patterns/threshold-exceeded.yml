# threshold-exceeded — a monitored value crosses a safety limit.
# =============================================================================
# PATTERNS ARE UNIVERSAL AND SHIP WITH THE TOOL. There is no project data in
# this file: no message id, no signal name, no threshold, no node name. Those
# arrive as parameters from a scenario, which is where one project's judgement
# lives. A pattern describes a SHAPE; a scenario binds it to a vehicle.
#
# DERIVED, NOT INVENTED. This shape was read off the Phase 1 scenarios rather
# than imagined: overtemp-fault, overtemp-boundary and overvolt-boundary are all
# instances of it, and their common verb sequence is
#
#     wait_uart -> write_symbol -> expect_no_can -> expect_symbol
#               -> write_symbol -> expect_can    -> write_symbol -> expect_can
#
# WHY THE BOUNDARY IS THE WHOLE POINT
# -----------------------------------------------------------------------------
# All eight of the original Phase 1 scenarios passed against a firmware whose
# over-temperature comparison had been inverted from `>` to `>=`, because every
# one of them injected a value comfortably past the limit, where both
# implementations behave identically. Coverage of the rule was total and
# discrimination was zero.
#
# The two adjacent values at the boundary carry the entire discrimination power
# of a sweep over this pattern. Everything further out confirms the obvious.
# The generator therefore REFUSES to expand a sweep that omits them.
# =============================================================================

id: threshold-exceeded
name: Sensor value exceeds a limit
description: |
  A monitored value crosses a safety threshold. The firmware must raise a fault
  within a deadline, and the boundary reading itself is legal — the fault occurs
  strictly above the limit.

  The legal half of the boundary needs guarding: "no fault frame appeared" is
  also what an injection that never landed looks like. This pattern therefore
  reads the value back out of the running machine, so the assertion rests on the
  rule's own input rather than on the absence of evidence.

parameters:
  - { name: node,     type: node,              doc: "the device under test" }
  - { name: symbol,   type: injectable_symbol, doc: "the sensor input the rule reads" }
  - { name: limit,    type: number,            doc: "the threshold, in the symbol's own units" }
  - { name: unit,      type: string,           doc: "for the human-readable label only" }
  - { name: message,  type: message_id,        doc: "the frame the fault is announced on" }
  - { name: signal,   type: signal,            doc: "the field carrying the fault code" }
  # Named value_name, not value: `value` is reserved for the swept value the
  # generator binds per test, and two different things under one name is how
  # a step goes out with a hole in it.
  - { name: value_name, type: enum_value,      doc: "the fault code expected" }
  - { name: deadline, type: duration,          doc: "how long the firmware may take" }
  - { name: latching, type: boolean,           doc: "whether cooling back down clears it" }
  - { name: healthy,  type: number,            doc: "a value comfortably inside the limit" }
  - { name: observe_ms, type: duration,        doc: "how long the legal side watches the announcement identifier for silence. Should exceed rebroadcast, so a device that HAD faulted cannot hide between two restatements" }
  - { name: state_message, type: message_id,   doc: "the frame on which the device reports what it is currently doing. Read once per moment, immediately before the stimulus, so a moment's variant asserts something its siblings do not" }
  - { name: state_signal,  type: signal,       doc: "the field on it carrying that condition" }
  - { name: state_window,  type: duration,     doc: "how long to watch for that frame. Must exceed its period, or the witness fails for a reason that has nothing to do with the firmware. Taken OUT of the wait before the stimulus, so the stimulus still lands at the declared moment" }
  - { name: latch_ms,   type: duration,        doc: "how long the announcement is watched after the value returns to healthy. Latching only" }
  - { name: boot_timeout, type: duration,      doc: "how long the device may take to reach its application entry point" }

sweep:
  around: limit
  # STRICT: the limit itself is legal, the first faulting value is limit + step.
  # A pattern whose condition is "the window has elapsed" is non-strict instead;
  # getting this backwards inverts every expectation in the sweep, which is why
  # the generator tests it separately.
  comparison: strict
  step: 1
  # The moment sweep witnesses the device's condition before injecting, and
  # that observation takes bus time. It comes out of the wait in front of the
  # stimulus rather than being added on the end, so a variant named for a
  # moment applies its stimulus at that moment and not one window later.
  at_lead_by: "{{state_window}}"

# The shape, in the eleven verbs. {{param}} is substituted per test; {{value}}
# is the swept value for this instance and {{expected}} is legal|fault, decided
# by the generator from `comparison` and never by this file.
steps:
  - wait_uart:     { node: "{{node}}", text: "{{boot_text}}", timeout_ms: "{{boot_timeout}}" }

  # The second sweep dimension: WHEN the value arrives.
  #
  # A threshold rule is evaluated on the control loop's tick, so the same
  # reading landing at different points in a drive meets the firmware in
  # different conditions -- and a rule that is correct in one is not
  # automatically correct in another. That is the ONLY thing that makes the
  # moment worth a dimension, so the condition is asserted rather than assumed:
  # each moment is witnessed on the bus, immediately before the stimulus, and
  # the scenario declares a different witness per moment.
  #
  # Earned. Without the witness every variant of a moment sweep carried a
  # byte-identical assertion list, three moments tripled a suite's test count
  # while adding no claim, and the scenario's prose justification named a
  # condition the firmware never reaches -- unchecked, because nothing checked
  # it. The generator now refuses a moment that declares no witness, and two
  # moments that witness the same condition.
  #
  # {{at}} and {{at_state}} are bound by the generator per test, and {{at_lead}}
  # is {{at}} minus the window below, so the stimulus still lands at {{at}}.
  # A scenario that declares no `at` list gets one test per value, as before.
  - run_for:       { ms: "{{at_lead}}" }
  - expect_can:    { id: "{{state_message}}",
                     signals: { "{{state_signal}}": "{{at_state}}" },
                     within_ms: "{{state_window}}",
                     label: "at {{at}} the device reports {{at_state}}, which is the condition this variant injects into" }
  - mark:          "{{symbol}} driven to {{value}} {{unit}} at {{at}}, with the device reporting {{at_state}} — expected {{expected}}"
  - write_symbol:  { node: "{{node}}", symbol: "{{symbol}}", value: "{{value}}" }

  # The rule's own input, read back from the running machine. This is what makes
  # the legal half of the boundary meaningful rather than vacuous.
  - expect_symbol: { node: "{{node}}", symbol: "{{symbol}}", equals: "{{value}}",
                     label: "the value the rule compares really is {{value}} {{unit}}" }

  # Exactly one of the following two is emitted, chosen by {{expected}}.
  - when_legal:
      - expect_no_can: { id: "{{message}}", for_ms: "{{observe_ms}}",
                         label: "{{value}} {{unit}} is legal: no fault frame" }
  - when_fault:
      - expect_can:    { id: "{{message}}", signals: { "{{signal}}": "{{value_name}}" },
                         within_ms: "{{deadline}}",
                         label: "{{value}} {{unit}} faults with {{value_name}}" }
      # Latching is a property of the rule, so the check belongs to the pattern.
      - when_latching:
          - write_symbol: { node: "{{node}}", symbol: "{{symbol}}", value: "{{healthy}}" }
          - expect_can:   { id: "{{message}}", signals: { "{{signal}}": "{{value_name}}" },
                            within_ms: "{{latch_ms}}",
                            label: "the fault stays latched after the value returns" }
