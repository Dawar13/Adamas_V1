# Charger — on-board AC charger.
#
# Console over UART. Zephyr's nucleo_h743zi board definition selects usart3 as
# the console, which is the instance the harness taps in the emulator.
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# CAN. The bitrate itself comes from the devicetree (boards/*.overlay), never
# from Kconfig, so that scripts/build-firmware.sh can read back what the
# compiler actually concluded rather than what we believe we asked for.
CONFIG_CAN=y

# Same binary shape we want under test, not a special emulator build.
CONFIG_ASSERT=y

CONFIG_MAIN_STACK_SIZE=2048
