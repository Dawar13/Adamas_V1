# updater — the device under test for the power-loss scenarios.
#
# Console over UART, CAN for status, and the internal flash driver, which is
# what makes this node interesting: it is the only app in this project that
# writes its own flash while running.
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

CONFIG_CAN=y

# The internal flash driver. The board's own devicetree already describes the
# controller (st,stm32h7-flash-controller at 0x52002000) and the slot layout;
# nothing here invents either.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y

# CRC32 over the staged payload, from Zephyr's own implementation rather than
# one written here: a bespoke CRC that disagreed with the tool computing the
# expected value would fail every test for a reason that is not about power.
CONFIG_CRC=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CAN_LOG_LEVEL_ERR=y

CONFIG_ASSERT=y
