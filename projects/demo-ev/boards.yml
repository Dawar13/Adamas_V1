# Board targets — the per-board detail everything downstream reads.
#
# THIS FILE IS DATA, NOT ENGINE CODE. It lives under harness/ because the spec
# places it here, but it is the same kind of thing as catalog.yml and
# network.yml: a saved project's arrangement. The rule "the engine contains no
# project data" (PROJECT.md §2.7) is a rule about *code*, verified by grepping
# harness/**.py — not this file. The whole point of boards.yml is to be the one
# place a peripheral name is allowed to appear, so that no peripheral name ever
# has to appear in Python.
#
# -----------------------------------------------------------------------------
# BOARD KEYS ARE ECU ROLES, NOT SILICON
# -----------------------------------------------------------------------------
# network.yml says `board: bms_ecu`, never `board: nucleo_h743zi`. The silicon
# is named only here. Retargeting the whole project onto different hardware is
# therefore an edit to this file alone — no scenario changes, no topology
# changes. That indirection already earned its keep once: Phase 1 started on
# S32K388 and moved to STM32H743 without touching network.yml or any scenario.
#
# -----------------------------------------------------------------------------
# PERIPHERAL NAMES ARE RENODE'S NAMES, NOT ZEPHYR'S
# -----------------------------------------------------------------------------
# They differ, and the emulator only answers to its own. A name that resolves to
# nothing is a run that cannot happen:
#
#   chip        Zephyr devicetree      Renode peripheral
#   STM32H743   fdcan1                 fdcan1
#   STM32H743   usart3                 usart3
#   S32K3xx     flexcan0               can0
#
# -----------------------------------------------------------------------------
# TIERS (PROJECT.md §2.1): verified | modelled | declared
#   verified  real firmware ran on it in a full scenario run, with evidence
#   modelled  the emulator supports it; we have not verified it end to end
#   declared  definable, but no execution path exists — refuses to run
# =============================================================================

# -----------------------------------------------------------------------------
# The working target. Two machines demonstrably exchange CAN frames on it.
# -----------------------------------------------------------------------------

ota_ecu:
  repl: platforms/boards/ota_ecu.repl
  zephyr_board: nucleo_h743zi
  can_peripheral: sysbus.fdcan1
  uart_peripheral: sysbus.usart3
  cpu_peripheral: sysbus.cpu
  vector_table_symbol: null
  # WHAT A POWER CUT TAKES WITH IT.
  #
  # Every volatile region on this part, from the chip's own memory map. The
  # engine must not guess where a customer's RAM is: a guess that named the
  # wrong region, or none, would wipe nothing, and power_cut would silently
  # become a warm reset while the scenario still reported PASS.
  #
  # Flash is deliberately absent. That is the whole point of the verb.
  ram_regions:
    - { base: 0x24000000, size: 0x80000 }   # axiSram, this board's main SRAM
    - { base: 0x20000000, size: 0x20000 }   # dtcm
    - { base: 0x00000000, size: 0x10000 }   # itcm
    - { base: 0x30000000, size: 0x48000 }   # sram1..3
    - { base: 0x38000000, size: 0x10000 }   # sram4
  # Where the core looks for its stack pointer and entry point when power comes
  # back. An ordinary Cortex-M part reads them from the first two words of
  # flash; parts that boot elsewhere say so here instead.
  reset_vector_address: 0x08000000
  can_bitrate: 500000
  tier: modelled
  notes: |
    ST Nucleo-H743ZI, single Cortex-M7 -- the same die as bms_ecu, entered
    separately because a board key is an ECU ROLE rather than a chip. This one
    is the role that writes its own flash, and it is the only board so far that
    declares what a power cut destroys.

bms_ecu:
  repl: platforms/boards/bms_ecu.repl
  zephyr_board: nucleo_h743zi
  can_peripheral: sysbus.fdcan1
  uart_peripheral: sysbus.usart3
  # PIN MAP -- the same rule as every peripheral above. `gpioPortD` is Renode's
  # name for this die's port D, and this is the only file allowed to say so.
  # A scenario names `main_contactor`; components.yml maps that to `coil`; and
  # only this line knows which port and index that is. Retargeting the coil onto
  # another pin, or another part, is an edit here and nowhere else.
  #
  # `pin_index` is the pin within the port, not a package pin number. It must
  # match the firmware's own devicetree overlay -- the two are independent
  # statements about one wire, and nothing cross-checks them. The key is not
  # spelled `index`, the block is not spelled `pins`, and the peripheral field
  # is not spelled `peripheral`: board vocabulary is forbidden inside
  # harness/expand.py by a purity guard that derives its forbidden words from
  # THIS FILE, so a key generic enough to be ordinary English collides with the
  # generator's own prose -- `pins` with "what pins the parameter list", and
  # `peripheral` with the sentence promising no peripheral name appears there.
  # The guard is right and the keys moved. See components.yml.
  pin_map:
    coil: { pin_peripheral: sysbus.gpioPortD, pin_index: 4 }
  # The core, for execution tracing. Named here for the same reason every
  # other peripheral is: the engine must not know what a CPU is called.
  cpu_peripheral: sysbus.cpu
  # Ordinary Cortex-M boot: the vector table sits at the start of flash and the
  # core finds it unaided. Only the S32K3 parts need an explicit offset.
  vector_table_symbol: null
  # network.yml's powertrain bus is 500 kbit/s, but Zephyr's nucleo_h743zi
  # devicetree ships bus-speed = <125000>. Each firmware carries an overlay
  # forcing 500000, and the build cross-checks it against network.yml. A silent
  # mismatch produces a bus where nothing communicates and no error anywhere.
  can_bitrate: 500000
  tier: modelled
  notes: |
    ST Nucleo-H743ZI, single Cortex-M7. CAN is Renode's CAN.MCAN model.
    Observed: two machines on one canHub exchanged 30 frames each, both
    directions, with can init_res=0 and can_start rc=0.
    Stays `modelled` until the full scenario suite passes on it.

vcu_ecu:
  repl: platforms/boards/vcu_ecu.repl
  zephyr_board: nucleo_h743zi
  can_peripheral: sysbus.fdcan1
  uart_peripheral: sysbus.usart3
  # The core, for execution tracing. Named here for the same reason every
  # other peripheral is: the engine must not know what a CPU is called.
  cpu_peripheral: sysbus.cpu
  vector_table_symbol: null
  can_bitrate: 500000
  tier: modelled

chg_ecu:
  repl: platforms/boards/chg_ecu.repl
  zephyr_board: nucleo_h743zi
  can_peripheral: sysbus.fdcan1
  uart_peripheral: sysbus.usart3
  # The core, for execution tracing. Named here for the same reason every
  # other peripheral is: the engine must not know what a CPU is called.
  cpu_peripheral: sysbus.cpu
  vector_table_symbol: null
