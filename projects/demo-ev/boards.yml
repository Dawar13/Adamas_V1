# -----------------------------------------------------------------------------
# NXP S32K388 — DECLARED. Definable, not runnable. Kept, not deleted, because
# the automotive part is the one an EV engineer recognises and because the
# blocker is specific and may be fixable later.
# -----------------------------------------------------------------------------

bms_s32k:
  repl: platforms/boards/bms_s32k.repl
  zephyr_board: mr_canhubk3
  can_peripheral: sysbus.can0
  uart_peripheral: sysbus.lpuart2
  # The core, for execution tracing. Named here for the same reason every
  # other peripheral is: the engine must not know what a CPU is called.
  cpu_peripheral: sysbus.cpu
  # S32K3 has no boot ROM parsing the IVT under emulation, so the vector table
  # offset must be set from the ELF or the core runs from a garbage table.
  # Renode's own scripts/single-node/nxp-s32k388_zephyr.resc does exactly this.
  vector_table_symbol: _vector_table
  can_bitrate: 500000
  tier: declared
  blocked_by: missing-peripheral-model
  notes: |
    The CPU, memory, UART and timers all work. The core executes real firmware
    and prints its banner, and after our SysTick correction firmware time
    tracks virtual time 1:1. What does not work is CAN, which is the entire
    subject of this product — so no verdict can be produced here, and the tier
    says so rather than implying a partial pass.

    Root cause, from the driver's own log:
      <dbg> can_common: can_calc_timing_int: SP error: 65535 1/1000
      <dbg> can_mcux_flexcan: Presc: 0, Seg1S1: 0, Seg2: 0
      <err> can_mcux_flexcan: failed to set timing (err -134)
      device init_res = 19 (ENODEV)

    Prescaler and both bit-timing segments compute to zero: the driver cannot
    derive a 500 kbit/s timing because there is no usable FlexCAN source clock
    to divide. Renode 1.16.1 does not model S32K3 clock generation — MC_CGM is
    Tagged, and the clock-mux status registers are `flipflop.py` stubs that
    exist only to stop the boot polling loops hanging.

    Classification (PROJECT.md §7): missing-peripheral-model, not
    address-error. No configuration change fixes it; it needs a clock model.

vcu_s32k:
  repl: platforms/boards/vcu_s32k.repl
  zephyr_board: mr_canhubk3
  can_peripheral: sysbus.can0
  uart_peripheral: sysbus.lpuart2
  # The core, for execution tracing. Named here for the same reason every
  # other peripheral is: the engine must not know what a CPU is called.
  cpu_peripheral: sysbus.cpu
  vector_table_symbol: _vector_table
  can_bitrate: 500000
  tier: declared
  blocked_by: missing-peripheral-model

chg_s32k:
  repl: platforms/boards/chg_s32k.repl
  zephyr_board: mr_canhubk3
  can_peripheral: sysbus.can0
  uart_peripheral: sysbus.lpuart2
  # The core, for execution tracing. Named here for the same reason every
  # other peripheral is: the engine must not know what a CPU is called.
  cpu_peripheral: sysbus.cpu
  vector_table_symbol: _vector_table
  can_bitrate: 500000
  tier: declared
  blocked_by: missing-peripheral-model

