# ota-cut-sweep — the demo. Power dies at each of many instants across one
# firmware update, and we find out which instants leave a device that boots.
#
# THIS FILE IS PROJECT DATA. The shape comes from patterns/power-lost-during-
# update.yml; everything below binds it to this device.
#
# The values are chosen to cross every phase the update has: before the erase
# finishes, early in the payload, through the middle of it, and past the last
# chunk where the header has been written and the image is complete. A sweep
# that only sampled one phase would report a single answer many times.

id: ota-cut-sweep
title: Power lost at each instant across a firmware update
description: >
  One update, interrupted at a different instant in each variant. Every variant
  asserts the same thing, because there is no instant at which losing power is
  allowed to brick the device.

pattern: power-lost-during-update

params:
  node: updater
  command_symbol: g_ota_command
  state_symbol: g_ota_state
  # STATE_BOOT. A device that came back and validated its flash is at rest
  # here; one that had resumed the update on its own would not be.
  idle_state: 0
  cut_at: 6ms
  boot_timeout: 400ms
  return_window: 400ms

sweep:
  # Virtual milliseconds after the update is commanded. Measured, not guessed:
  # a full update on this device takes about 8 ms of virtual time, so this walks
  # from before the erase completes to past the final header write.
  values: [1ms, 2ms, 3ms, 4ms, 5ms, 6ms, 7ms, 8ms, 9ms, 12ms]
