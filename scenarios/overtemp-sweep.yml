# overtemp-sweep — the over-temperature limit, walked across its boundary.
# =============================================================================
# THIS FILE IS PROJECT DATA. The pattern supplies the SHAPE; everything below
# binds it to this vehicle. Ids and signal names come from catalog.yml, node
# and symbol names from network.yml, and the limit from the firmware itself
# (firmware/bms/src/bms.h: BMS_OVERTEMP_LIMIT_dC 550).
#
# WHY A SWEEP AND NOT A SINGLE VALUE
# -----------------------------------------------------------------------------
# All eight original Phase 1 scenarios passed against a firmware whose
# comparison had been inverted from `>` to `>=`, because every one injected a
# value comfortably past the limit where both implementations behave
# identically. The two adjacent values at the boundary carry the entire
# discrimination power; everything further out confirms the obvious.
#
# The generator REFUSES to expand this without the boundary pair, so the
# property cannot be lost by editing the list carelessly.
# =============================================================================

id: overtemp-sweep
title: Over-temperature across its boundary, at several points in the drive
description: >
  Walk the cell-temperature limit from comfortably legal to comfortably over,
  landing exactly on the limit and one tenth of a degree above it. The limit
  itself must be legal; the first value above it must fault and latch.

pattern: threshold-exceeded

params:
  node: bms
  symbol: g_cell_temp_dC
  limit: 550
  unit: dC
  message: 0x604
  signal: fault_code
  value_name: OVERTEMP
  deadline: 50
  latching: true
  healthy: 250
  observe_ms: 300
  latch_ms: 600
  boot_timeout: 100

  # Where the pack says what it is doing. 0x602 carries the main contactor,
  # broadcast every 100 ms, and its three values are exactly the three
  # conditions the pack passes through on this bus with nothing requested of
  # it: open while idle, precharging, closed once HV is live. The window is
  # 150 ms so one broadcast is certain to fall inside it.
  state_message: 0x602
  state_signal: contactor_state
  state_window: 150

sweep:
  # 550 is the limit and 551 the first faulting value: the mandatory pair.
  # The rest confirm the behaviour is monotonic rather than a coincidence at
  # one point.
  values: [500, 530, 545, 549, 550, 551, 555, 570, 600, 650]

  # WHEN the reading arrives, measured from the end of the boot wait, and WHAT
  # the pack reports at that instant. The witness is asserted before the value
  # is injected, so each variant makes a claim its siblings do not, and the
  # generator refuses two moments that witness the same condition.
  #
  # OBSERVED, NOT ASSUMED. Read off a real run of this scenario
  # (harness/out/audit-state/overtemp-sweep-550-at-1500ms): with nothing asked
  # of the pack, the charge port opens a session on its own, so the pack goes
  # STANDBY -> PRECHARGE at 600 ms -> CHARGING at 800 ms and stays there. Its
  # 0x602 broadcasts carry contactor_state 0 up to 500 ms, 1 at 600 and 700 ms,
  # and 2 from 800 ms on.
  #
  # The previous list said "800 running, contactor closed and under load" and
  # "1500 well into the drive". The pack never reaches RUNNING in this scenario
  # -- nothing ever requests drive -- and 800 and 1500 are the same condition,
  # so a third of these tests asserted nothing the second third did not. The
  # three below are the three conditions that genuinely exist here.
  at:
    - { ms: 200,  state: OPEN }        # idle: HV down, contactor open
    - { ms: 600,  state: PRECHARGE }   # the precharge dwell, HV coming up
    - { ms: 900,  state: CLOSED }      # session live, contactor closed
