# The pressure-sensor node — the second example system's device under test.
#
# Console over UART. This board's overlay chooses usart2, not the board
# definition's default usart3, and examples/sensor-node/boards.yml names
# sysbus.usart2 as the instance the harness taps. Those two must agree or the
# banner is never seen and every scenario fails on wait_uart.
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# CAN. The controller comes from the devicetree `zephyr,canbus` chosen node,
# which the overlay points at fdcan2; no peripheral name appears in the C.
CONFIG_CAN=y

# Driver errors on the console rather than in silence. A controller that fails
# to configure its bit timing still boots and still prints the banner -- it just
# never speaks, which is indistinguishable from broken application logic unless
# the driver is allowed to say so.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CAN_LOG_LEVEL_ERR=y

# The same binary shape we intend to run under test, not a special emulator
# build. The claim is that the binary under test is the binary that ships.
CONFIG_ASSERT=y
