# VCU — vehicle control unit.
#
# Console over UART. Zephyr's nucleo_h743zi board definition selects usart3 as
# the console, which is the instance harness/boards.yml taps in the emulator.
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# Classic CAN on fdcan1. The bitrate itself is NOT set here: it comes from
# bus-speed in boards/nucleo_h743zi.overlay, which build-firmware.sh reads back
# out of the GENERATED devicetree and compares against network.yml.
CONFIG_CAN=y

# Same binary shape as the one under test — no emulator-only build.
CONFIG_ASSERT=y
