# BMS — the device under test.
#
# Console over UART. Zephyr's nucleo_h743zi board definition selects usart3 as
# the console, which is the instance wired to the ST-Link virtual COM port on
# real hardware and the instance the harness taps in the emulator
# (harness/boards.yml: uart_peripheral: sysbus.usart3).
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# CAN. The controller comes from the devicetree `zephyr,canbus` chosen node,
# which this board points at fdcan1; no peripheral name appears in the C.
CONFIG_CAN=y

# Driver errors on the console rather than in silence. A CAN controller that
# fails to configure its bit timing still boots and still prints the banner --
# it just never speaks, which is indistinguishable from broken application
# logic unless the driver is allowed to say so. That failure mode cost a whole
# board bring-up on S32K (docs/STATUS.md §1.1), so it is diagnosable here by
# default. Immediate mode logs from the calling context, so nothing is
# buffered past the moment it mattered and nothing is deferred to a thread
# whose scheduling could vary.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CAN_LOG_LEVEL_ERR=y

# No stack canaries or asserts stripped: this is the same binary shape we want
# to run under test, not a special emulator build. Bench's whole claim is that
# the binary under test is the binary that ships.
CONFIG_ASSERT=y
