# BMS — Phase 0 configuration.
#
# Console over UART. Zephyr's nucleo_h743zi board definition selects usart3 as
# the console, which is the instance wired to the ST-Link virtual COM port on
# real hardware and the instance the harness taps in the emulator.
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# CAN is not exercised in Phase 0. It is enabled here so the build proves the
# CAN subsystem and the STM32 FDCAN driver link against this board before
# Phase 1 depends on them. Finding out that CAN does not link is much cheaper
# now than in the middle of bringing up the test engine.
CONFIG_CAN=y

# No stack canaries or asserts stripped: this is the same binary shape we want
# to run under test, not a special emulator build. Bench's whole claim is that
# the binary under test is the binary that ships.
CONFIG_ASSERT=y
